<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found</title>
<!-- SELF-CONTAINED ON PURPOSE. A forced 404 renders this body at whatever URL
     was requested, so a relative stylesheet or image would resolve against that
     path and fail. Everything this page needs is inline. -->
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#11161a; color:#e9eef2;
         font:400 16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:30rem; padding:2.5rem 1.5rem; text-align:center; }
  h1 { font-size:1.35rem; font-weight:600; margin:0 0 .75rem; }
  p { margin:0 0 1.5rem; color:rgba(233,238,242,.7); }
  a { color:#b9a46a; text-decoration:none; border-bottom:1px solid rgba(185,164,106,.4); }
  a:hover { border-bottom-color:#b9a46a; }
</style>
</head>
<body>
  <main>
    <h1>Not found</h1>
    <p>That page is not available.</p>
    <p><a href="/">Return home</a></p>
  </main>
</body>
</html>
